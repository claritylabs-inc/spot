<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spot</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="bar">
      <button id="capture" type="button" disabled>Use this page</button>
      <p id="status" role="status" aria-live="polite">Loading Spot…</p>
      <button id="reload" type="button" class="quiet">Reload</button>
      <button id="open" type="button" class="quiet">Open Spot</button>
    </header>
    <iframe
      id="app"
      title="Spot"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads"
      allow="clipboard-write"
    ></iframe>
    <script src="config.js"></script>
    <script src="capture.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
