#:schema https://conductor.build/schemas/settings.repo.schema.json
"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

preview_urls = [
  { name = "Spot", url = "http://localhost:$CONDUCTOR_PORT" },
]

[scripts]
setup = "if [ \"$CONDUCTOR_IS_LOCAL\" = \"0\" ]; then npm run conductor:setup:cloud; else npm run conductor:setup; fi"
archive = "npm run conductor:archive"
run_mode = "concurrent"

[scripts.run.dev]
available_in = [ "local", "cloud" ]
command = "npm run conductor:dev"
default = true
icon = "rocket"

[scripts.run.email-deliveries]
available_in = [ "local", "cloud" ]
command = "npm run conductor:emails"
icon = "mail"

[scripts.run.web]
available_in = [ "local" ]
command = "PATH=\"$(brew --prefix node@24)/bin:$PATH\" node scripts/run-conductor-web.mjs"
icon = "globe"

[scripts.run.convex]
available_in = [ "local" ]
command = "PATH=\"$(brew --prefix node@24)/bin:$PATH\" CONVEX_AGENT_MODE=anonymous ./node_modules/.bin/convex dev --local-cloud-port $((CONDUCTOR_PORT + 3)) --local-site-port $((CONDUCTOR_PORT + 4))"
icon = "database"

[scripts.run.spectrum-terminal]
available_in = [ "local" ]
command = "PATH=\"$(brew --prefix node@24)/bin:$PATH\" npm run conductor:spectrum"
icon = "message-circle"

[scripts.run.operator-spectrum-terminal]
available_in = [ "local" ]
command = "PATH=\"$(brew --prefix node@24)/bin:$PATH\" npm run conductor:operator-spectrum"
icon = "message-square-lock"

[scripts.run.slack-worker]
available_in = [ "local" ]
command = "PATH=\"$(brew --prefix node@24)/bin:$PATH\" PORT=$((CONDUCTOR_PORT + 5)) node --env-file=.context/slack-worker.env slack-worker/dist/src/index.js"
icon = "hash"

[scripts.run.test]
command = "PATH=\"$(brew --prefix node@24)/bin:$PATH\" npm test"
icon = "test-tube"

[scripts.run.lint]
command = "PATH=\"$(brew --prefix node@24)/bin:$PATH\" npm run lint"
icon = "check"

[scripts.run.typecheck]
command = "PATH=\"$(brew --prefix node@24)/bin:$PATH\" npx tsc --noEmit"
icon = "braces"

[scripts.run.convex-typecheck]
command = "PATH=\"$(brew --prefix node@24)/bin:$PATH\" npx convex typecheck"
icon = "database"
