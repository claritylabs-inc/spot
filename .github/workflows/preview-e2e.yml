name: Preview E2E

# Runs when Vercel finishes a Preview deployment of a commit mirrored from a PR
# labeled `preview` (see preview.yml). Vercel reports the commit SHA, not the
# branch, as the deployment ref, so the PR is looked up from the SHA.
# The preview has its own Convex deployment, seeded by `provisionPreview`.

on: deployment_status

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-e2e-${{ github.event.deployment.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    if: >-
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Preview')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Find the labeled PR for this commit
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh api "repos/${{ github.repository }}/commits/${{ github.event.deployment.sha }}/pulls" \
            --jq '[.[] | select(.state == "open" and any(.labels[]; .name == "preview"))][0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - if: steps.pr.outputs.number != ''
        uses: useblacksmith/checkout@v1
        with:
          ref: ${{ github.event.deployment.sha }}

      - if: steps.pr.outputs.number != ''
        uses: ./.github/actions/setup

      - if: steps.pr.outputs.number != ''
        run: npx playwright install --with-deps chromium

      - name: Run E2E against the preview
        if: steps.pr.outputs.number != ''
        env:
          APP_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          PREVIEW_E2E_PASSWORD: ${{ secrets.PREVIEW_E2E_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/preview-e2e.mjs

      - uses: actions/upload-artifact@v4
        if: always() && steps.pr.outputs.number != ''
        with:
          name: preview-e2e
          path: .context/qa/preview
          if-no-files-found: ignore

      - name: Comment result on the PR
        if: always() && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          gh pr comment "${{ steps.pr.outputs.number }}" --repo "${{ github.repository }}" \
            --body "Preview E2E **$RESULT** for \`${{ github.event.deployment.sha }}\`: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
