name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  root:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: useblacksmith/checkout@v1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Check cl-router API contract
        run: npm run check:cl-router-contract

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Typecheck Next.js
        run: npx tsc --noEmit --incremental false

      - name: Typecheck Convex
        run: npx convex typecheck

      - name: Build
        run: npm run build

  packages:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        package:
          - cli
          - operator-cli
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: useblacksmith/checkout@v1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Typecheck
        run: npm run typecheck
