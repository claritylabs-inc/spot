name: Release Spot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write
  statuses: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Check shared package versions
        run: npm run check:shared-package-versions

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Typecheck Next.js
        run: npx tsc --noEmit --incremental false

      - name: Typecheck Convex
        run: npx convex typecheck

      - name: Build
        run: npm run build

  validate-workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Build extraction worker
        working-directory: extraction-worker
        run: npm ci --include=dev --no-audit --no-fund --loglevel=error && npm run build

      - name: Build iMessage worker
        working-directory: imessage-worker
        run: npm ci --include=dev --no-audit --no-fund --loglevel=error && npm run build

      - name: Build and test Slack worker
        working-directory: slack-worker
        run: npm ci --include=dev --no-audit --no-fund --loglevel=error && npm run build && npm test

      - name: Syntax-check mailbox scan worker
        run: node --check mailbox-scan-worker/src/index.js

  validate-packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - cli
          - operator-cli
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Typecheck
        run: npm run typecheck

  deploy:
    runs-on: ubuntu-latest
    needs:
      - validate-root
      - validate-workers
      - validate-packages
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Deploy production Convex
        if: github.ref_name == 'main'
        run: |
          if [[ ! "$OPERATOR_IMESSAGE_CONTACT_PHONE" =~ ^\+[1-9][0-9]{7,14}$ ]]; then
            echo "SPOT_PRODUCTION_OPERATOR_IMESSAGE_CONTACT_PHONE must be configured as an E.164 number"
            exit 1
          fi
          npx convex deploy --yes
          sdk_version="$(node -p "require('./extraction-worker/package.json').dependencies['@claritylabs/cl-sdk']")"
          npx convex env set EXTRACTION_WORKER_EXPECTED_CL_SDK_VERSION "$sdk_version"
          npx convex env set OPERATOR_SLACK_ENABLED true
          npx convex env set OPERATOR_IMESSAGE_ENABLED true
          npx convex env set OPERATOR_IMESSAGE_TERMINAL_ENABLED false
          npx convex env set OPERATOR_IMESSAGE_CONTACT_PHONE "$OPERATOR_IMESSAGE_CONTACT_PHONE"
          npx convex env set QUO_BROKER_WEBHOOK_SECRET "$QUO_BROKER_WEBHOOK_SECRET"
          npx convex env set QUO_BROKER_PHONE_NUMBER_ID "$QUO_BROKER_PHONE_NUMBER_ID"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          OPERATOR_IMESSAGE_CONTACT_PHONE: ${{ vars.SPOT_PRODUCTION_OPERATOR_IMESSAGE_CONTACT_PHONE }}
          QUO_BROKER_WEBHOOK_SECRET: ${{ secrets.QUO_BROKER_WEBHOOK_SECRET }}
          QUO_BROKER_PHONE_NUMBER_ID: ${{ vars.SPOT_PRODUCTION_QUO_BROKER_PHONE_NUMBER_ID }}

  release-ready-production:
    if: always() && github.ref_name == 'main'
    name: release-ready-production
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Require Convex deployment success
        if: needs.deploy.result != 'success'
        run: |
          echo "Convex deployment result was ${{ needs.deploy.result }}"
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Wait for Railway services
        run: node scripts/wait-for-railway-statuses.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RAILWAY_STATUS_CONTEXTS: |
            Spot - spot-extraction-worker
            Spot - imessage-worker
            Spot - operator-imessage-worker
            Spot - slack-worker
            Spot - spot-mailbox-scan-worker

      - name: Check deployed service compatibility
        run: node scripts/check-agent-deployment-health.mjs --env production
        env:
          AGENT_HEALTH_ATTEMPTS: 30
          AGENT_HEALTH_RETRY_DELAY_MS: 10000
          SPOT_PRODUCTION_CL_ROUTER_HEALTH_URL: ${{ vars.SPOT_PRODUCTION_CL_ROUTER_HEALTH_URL }}
          SPOT_PRODUCTION_SLACK_WORKER_HEALTH_URL: ${{ vars.SPOT_PRODUCTION_SLACK_WORKER_HEALTH_URL }}
          SPOT_PRODUCTION_OPERATOR_IMESSAGE_WORKER_HEALTH_URL: ${{ vars.SPOT_PRODUCTION_OPERATOR_IMESSAGE_WORKER_HEALTH_URL }}

      - name: Verify release is still the branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq '.object.sha')"
          if [[ "$branch_sha" != "$GITHUB_SHA" ]]; then
            echo "Refusing to release stale commit $GITHUB_SHA; ${GITHUB_REF_NAME} is now $branch_sha"
            exit 1
          fi

  publish-cli:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    needs: deploy
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/package-lock.json
          registry-url: https://registry.npmjs.org

      - run: npm ci --no-audit --no-fund --loglevel=error

      - run: npm run typecheck

      - run: npm pack --dry-run

      - name: Check npm version
        id: npm-version
        shell: bash
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if NPM_CONFIG_USERCONFIG=/dev/null npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is not published yet"
          fi

      - name: Publish CLI
        if: steps.npm-version.outputs.published == 'false'
        run: npm publish

  publish-operator-cli:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    needs: deploy
    defaults:
      run:
        working-directory: operator-cli
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: operator-cli/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@claritylabs-inc"

      - run: npm ci --no-audit --no-fund --loglevel=error

      - run: npm run typecheck

      - run: npm pack --dry-run

      - name: Check GitHub Packages version
        id: github-package-version
        shell: bash
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is not published yet"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish operator CLI
        if: steps.github-package-version.outputs.published == 'false'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
