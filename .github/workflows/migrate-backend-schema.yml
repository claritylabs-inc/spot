name: Migrate backend schema

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the reviewed, fixed-scope schema migrations
        type: boolean
        default: false
        required: true
      restore_company_facts:
        description: Restore the 22 audited historical company facts from run 34902637845
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: backend-schema-migration-production
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund --loglevel=error
      - name: Require a backed-up write run for historical fact recovery
        if: inputs.restore_company_facts && !inputs.apply
        run: exit 1
      - name: Audit or migrate production
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          APPLY_SCHEMA_MIGRATIONS: ${{ inputs.apply }}
          SCHEMA_MIGRATION_OUTPUT_DIR: ${{ runner.temp }}/schema-migration
        run: |
          if [[ "$APPLY_SCHEMA_MIGRATIONS" == "true" ]]; then
            node scripts/migrate-backend-schema.mjs --prod --apply
          else
            node scripts/migrate-backend-schema.mjs --prod
          fi
      - uses: actions/download-artifact@v4
        if: inputs.restore_company_facts
        with:
          name: backend-schema-migration-34902637845
          run-id: 34902637845
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior-schema-migration
      - name: Restore and verify historical company facts
        if: inputs.restore_company_facts
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          SCHEMA_MIGRATION_OUTPUT_DIR: ${{ runner.temp }}/schema-migration
          ARCHIVED_COMPANY_FACTS: ${{ runner.temp }}/prior-schema-migration/database-20260914-221049.zip
        run: node scripts/restore-archived-company-facts.mjs "$ARCHIVED_COMPANY_FACTS"
      - name: Preserve migration report and rollback database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-schema-migration-${{ github.run_id }}
          path: ${{ runner.temp }}/schema-migration/
          if-no-files-found: ignore
          retention-days: 7
