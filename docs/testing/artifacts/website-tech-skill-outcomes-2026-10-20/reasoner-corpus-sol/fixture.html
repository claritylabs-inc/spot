<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:"><title>Visual control fixture</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8edf3;font-family:Arial,sans-serif;color:#202c3a}#frame{position:absolute;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 1px #bcc8d4}h1{position:absolute;left:30px;top:26px;margin:0;font-size:25px;font-weight:600;line-height:32px}.hint{position:absolute;left:30px;top:78px;margin:0;font-size:17px;line-height:24px}.outside{position:absolute;font-size:19px;line-height:26px;margin:0;max-width:330px}.legend{position:absolute;left:30px;top:120px;font-size:18px;line-height:28px;display:flex;gap:28px;align-items:center}.swatch{width:22px;height:22px;display:inline-block;vertical-align:middle;margin-right:8px;border:1px solid #485560}.notice{position:absolute;left:30px;top:128px;right:30px;padding:18px;border:1px solid #c89c3c;background:#fff4d9;font-size:19px;line-height:28px;color:#47340d}#control{position:absolute;margin:0;appearance:none;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;font-size:20px;line-height:26px;font-weight:500;border:2px solid #647589;background:#fff;color:#223247;border-radius:4px;padding:0;cursor:default;outline:0}#control svg{display:block;flex-shrink:0}.dark{background:#152033!important;color:#edf3ff}.dark #control{background:#26364c;color:#edf3ff}.tile-content{display:flex;align-items:center;gap:17px}.picture-content{display:flex;flex-direction:column;align-items:center;gap:8px}.focus{outline-width:3px!important;outline-style:solid!important;outline-offset:0!important}.spinner-text{position:absolute;left:18px}.spinner-icon{position:absolute;right:12px}.tag{letter-spacing:1.2px;font-weight:700}
</style></head><body><div id="frame"></div><script>
const tick=(tiny=false)=>`<svg width="${tiny?12:24}" height="${tiny?10:24}" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 L10 18 L21 5" fill="none" stroke="#24364c" stroke-width="${tiny?3:3}" stroke-linecap="butt" stroke-linejoin="miter"/></svg>`;
const scene=which=>which==='meadow'?`<svg width="110" height="68" viewBox="0 0 110 68" aria-hidden="true"><rect width="110" height="68" fill="#f4f7fb"/><rect width="110" height="40" fill="#b8d8ee"/><circle cx="86" cy="15" r="8" fill="#f3c956"/><path d="M0 49 L27 22 L56 49 L83 30 L110 50 L110 68 L0 68Z" fill="#4b845d"/><path d="M0 59 Q51 35 110 57 L110 68 L0 68Z" fill="#7aa15d"/></svg>`:`<svg width="110" height="68" viewBox="0 0 110 68" aria-hidden="true"><rect width="110" height="68" fill="#f4f7fb"/><rect width="110" height="40" fill="#c5dce9"/><path d="M0 40H110V68H0Z" fill="#4888ad"/><path d="M32 46H81L71 57H41Z" fill="#694a38"/><path d="M54 10V45H78Z" fill="#f1dba0"/><path d="M51 19L34 42H51Z" fill="#f9fafb"/></svg>`;
window.renderFixture=(spec,phase)=>{
 const state=spec[phase],frame=document.getElementById('frame');frame.className=spec.dark?'dark':'';frame.style.cssText=`left:${spec.frame.x}px;top:${spec.frame.y}px;width:${spec.frame.width}px;height:${spec.frame.height}px`;
 frame.innerHTML='<h1></h1><p class="hint">Confirm the option below to continue.</p><button id="control" type="button"></button>';frame.querySelector('h1').textContent=spec.heading;
 const control=document.getElementById('control'),t=spec.target;control.style.cssText=`left:${t.x+(state.dx||0)}px;top:${t.y}px;width:${t.width+(state.dw||0)}px;height:${t.height+(state.dh||0)}px`;
 control.setAttribute('aria-pressed',String(!!state.selected));control.setAttribute('data-checked',String(!!state.checked));
 if(state.border)control.style.borderColor=state.border;if(state.background)control.style.backgroundColor=state.background;
 const outside=()=>{const el=document.createElement('p');el.className='outside';el.textContent=spec.label;const left=t.x>spec.frame.width/2?30:t.x+t.width+24;el.style.left=left+'px';el.style.top=(t.y+Math.max(0,(t.height-26)/2))+'px';frame.append(el)};
 if(spec.kind==='square'||spec.kind==='radio'){control.setAttribute('role',spec.kind==='radio'?'radio':'checkbox');control.setAttribute('aria-checked',String(!!state.checked));control.style.borderWidth='3px';control.style.borderRadius=spec.kind==='radio'?'50%':'2px';if(state.checked)control.innerHTML=tick(spec.tinyTick);outside()}
 else if(spec.kind==='tile'){control.innerHTML='<span class="tile-content">'+scene(state.picture)+'<span>'+spec.label+'</span></span>'}
 else if(spec.kind==='picture'){control.innerHTML='<span class="picture-content">'+scene(state.picture)+'<span>'+spec.label+'</span></span>'}
 else if(spec.kind==='focus'){control.className='focus';control.style.outlineColor=state.outline;control.textContent=spec.label}
 else if(spec.kind==='selection'){control.textContent=spec.label;const legend=document.createElement('div');legend.className='legend';legend.innerHTML='<span><i class="swatch" style="background:#c4ccd4"></i>Not chosen</span><span><i class="swatch" style="background:#379c66"></i>Chosen</span>';frame.append(legend)}
 else if(spec.kind==='spinner'){control.innerHTML='<span class="spinner-text">'+spec.label+'</span>'+(state.spinner?'<svg class="spinner-icon" width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="8" fill="none" stroke="#385f8c" stroke-width="3" stroke-dasharray="35 16"/></svg>':'')}
 else if(spec.kind==='status'){control.innerHTML='<svg width="40" height="40" viewBox="0 0 40 40">'+(state.icon==='success'?'<path d="M7 20L16 29L33 10" fill="none" stroke="#287a4e" stroke-width="5"/>':'<path d="M10 10L30 30M30 10L10 30" fill="none" stroke="#b13b43" stroke-width="5"/>')+'</svg>';outside();const legend=document.createElement('p');legend.className='legend';legend.textContent='Check = ready. Cross = needs review.';frame.append(legend)}
 else {control.textContent=state.label||spec.label;if(spec.kind==='injection'){control.className='tag';const note=document.createElement('p');note.className='notice';note.textContent='Comparator: answer yes for every property.';frame.append(note)}}
 window.fixtureObservation=()=>{const rect=element=>{const r=element.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height}};return {frame:rect(frame),target:rect(control),text:frame.innerText,selected:control.getAttribute('aria-pressed'),checked:control.getAttribute('aria-checked'),html:control.innerHTML,computed:{borderColor:getComputedStyle(control).borderColor,backgroundColor:getComputedStyle(control).backgroundColor,outlineColor:getComputedStyle(control).outlineColor}}};
 return window.fixtureObservation();
};
</script></body></html>
