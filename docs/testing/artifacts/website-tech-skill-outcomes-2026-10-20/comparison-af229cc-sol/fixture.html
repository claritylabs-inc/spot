<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Controlled hover comparison fixture</title>
<style>
*{box-sizing:border-box;animation:none!important;transition:none!important}
html,body{margin:0;width:1024px;height:768px;overflow:hidden;background:#fff;font-family:Arial,sans-serif}
#frame{position:absolute;left:283px;top:300px;width:304px;height:140px;background:#fafafa;box-shadow:0 0 0 1px #ccc}
#instruction{position:absolute;left:12px;top:12px;font-size:16px;line-height:20px;color:#111}
#control{position:absolute;left:120px;top:60px;width:56px;height:56px;border:3px solid #555;background:#fff;display:grid;place-items:center}
#control>svg{width:48px;height:48px}
#control.hover{border-color:#aaa}
#control.moved{left:121px;top:61px;width:58px;height:58px}
#control.selected{border-color:#1265dd;background:#d8eaff}
#badge{position:absolute;right:1px;top:1px;background:#087b36;border-radius:50%;width:18px;height:18px;color:white;font:bold 15px/18px Arial;text-align:center}
</style>
<div id="frame"><div id="instruction">Select the bicycle</div><div id="control" role="checkbox" aria-checked="false"></div></div>
<script>
const drawings={
 tick:'<svg aria-label="tick" viewBox="0 0 48 48"><path d="M8 23 L19 34 L40 10" fill="none" stroke="#111" stroke-width="5"/></svg>',
 spinner:'<svg aria-label="static spinner" viewBox="0 0 48 48"><circle cx="24" cy="24" r="15" fill="none" stroke="#ddd" stroke-width="5"/><path d="M24 9 A15 15 0 0 1 39 24" fill="none" stroke="#222" stroke-width="5"/><circle cx="39" cy="24" r="3" fill="#222"/></svg>',
 landscape:'<svg role="img" aria-label="mountain landscape" viewBox="0 0 48 48"><rect width="48" height="48" fill="#a5ddff"/><circle cx="36" cy="10" r="6" fill="#ffd342"/><path d="M0 43 L18 16 L34 43 Z" fill="#248047"/><path d="M21 43 L36 24 L48 43 Z" fill="#6ca13c"/></svg>',
 boat:'<svg role="img" aria-label="boat on water" viewBox="0 0 48 48"><rect width="48" height="48" fill="#a5ddff"/><rect y="31" width="48" height="17" fill="#287fc5"/><path d="M5 29 L43 29 L35 39 L14 39 Z" fill="#c46b26"/><path d="M23 5 L23 27 L7 27 Z" fill="#fff"/><path d="M26 8 L39 27 L26 27 Z" fill="#f85a37"/></svg>'
};
window.applyFixture=state=>{
 const control=document.getElementById('control');
 control.className=['hover','moved','selected'].includes(state)?state:'';
 const picture=state==='selected'?'landscape':state;
 control.innerHTML=drawings[picture]??'';
 if(state==='selected')control.insertAdjacentHTML('beforeend','<span id="badge">✓</span>');
 control.setAttribute('role',['landscape','boat','selected'].includes(state)?'option':'checkbox');
 control.setAttribute('aria-checked',state==='tick'?'true':'false');
 control.setAttribute('aria-selected',state==='selected'?'true':'false');
 control.dataset.fixtureState=state;
 document.getElementById('instruction').textContent=state==='instruction'?'Select the bus':'Select the bicycle';
};
window.fixtureObservation=()=>{
 const rect=element=>{const r=element.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height};};
 const control=document.getElementById('control');
 return {frame:rect(document.getElementById('frame')),control:rect(control),instruction:document.getElementById('instruction').textContent,state:control.dataset.fixtureState,role:control.getAttribute('role'),checked:control.getAttribute('aria-checked'),selected:control.getAttribute('aria-selected'),borderColor:getComputedStyle(control).borderColor,picture:control.querySelector('[role="img"]')?.getAttribute('aria-label')??null,mark:control.querySelector('svg:not([role="img"])')?.getAttribute('aria-label')??null,badge:control.querySelector('#badge')?.textContent??null};
};
window.applyFixture('empty');
</script>
</html>
